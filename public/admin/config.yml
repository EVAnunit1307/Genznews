# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Sveltia CMS config — https://github.com/sveltia/sveltia-cms
# Log in with GitHub, write an article, hit Publish → commits Markdown to the
# repo → Vercel rebuilds → live in ~1 minute. No code required.

backend:
  name: github
  repo: EVAnunit1307/Genznews
  branch: main
  # OAuth relay = this site's own Vercel functions (api/auth + api/callback).
  # Update base_url to your final production domain.
  base_url: https://genznews.vercel.app
  auth_endpoint: /api/auth

# Fallback media location (per-collection override below keeps article images
# next to the Markdown so Astro optimizes them).
media_folder: public/uploads
public_folder: /uploads

site_url: https://genznews.vercel.app
display_url: https://genznews.vercel.app

collections:
  - name: pages
    label: Pages
    description: Editable sections of your site.
    files:
      - name: about
        label: About Me
        file: src/data/about.json
        description: The "About" section on your home page — and the name, role, bio, and LinkedIn used on every byline.
        fields:
          - label: Small label (eyebrow)
            name: eyebrow
            widget: string
            default: About
            hint: The tiny label above the heading.

          - label: Heading
            name: heading
            widget: string
            hint: The big italic headline of the About section.

          - label: About text
            name: body
            widget: text
            hint: 'Your story. Separate paragraphs with a blank line. Wrap a word in *stars* for italics or **double stars** for bold.'

          - label: Closing line
            name: closer
            widget: string
            required: false
            hint: The dimmer one-liner under your about text (e.g. "Independent. Just me.").

          - label: Pull quote
            name: quote
            widget: text
            hint: The highlighted quote in your writer card. (Quotation marks are added automatically.)

          - label: Your name
            name: authorName
            widget: string
            hint: Shown on every article byline and author card.

          - label: Your role / tagline
            name: authorRole
            widget: string

          - label: Short bio
            name: authorBio
            widget: text
            hint: One sentence — appears on the "Who wrote this" card under each article.

          - label: LinkedIn URL
            name: linkedin
            widget: string
            hint: Full link, e.g. https://www.linkedin.com/in/your-handle/

      - name: site
        label: Home & Site Text
        file: src/data/site.json
        description: Headlines and wording across the home page — the hero, the newsletter box, and the footer.
        fields:
          - label: Search-engine description
            name: description
            widget: text
            hint: One sentence describing the site. Shows in Google results and link-share previews.

          - label: Hero (top of the page, over the video)
            name: hero
            widget: object
            fields:
              - label: Big headline
                name: headline
                widget: string
                hint: The huge headline that animates in word by word.
              - label: Subheading
                name: subhead
                widget: text
                hint: The sentence under the headline.
              - label: Main button
                name: primaryCta
                widget: string
                hint: e.g. "Read the latest".
              - label: Secondary link
                name: secondaryCta
                widget: string
                hint: e.g. "What this is".

          - label: Feed section
            name: feed
            widget: object
            fields:
              - label: Section heading
                name: heading
                widget: string
                hint: The heading above your list of stories, e.g. "Today's feed".

          - label: Newsletter box
            name: newsletter
            widget: object
            fields:
              - label: Small label (eyebrow)
                name: eyebrow
                widget: string
              - label: Heading
                name: heading
                widget: string
              - label: Description
                name: body
                widget: text
                hint: The short pitch under the heading.

          - label: Footer
            name: footer
            widget: object
            fields:
              - label: Tagline
                name: tagline
                widget: text
                hint: The short paragraph next to the logo.
              - label: Bottom note
                name: note
                widget: string
                hint: The small line at the very bottom, e.g. "Built to be read on a phone."

  - name: articles
    label: Articles
    label_singular: Article
    description: Your published writing.
    folder: src/content/articles
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    # Empty = store uploaded images alongside the article; Astro optimizes them.
    media_folder: ''
    public_folder: ''
    summary: "{{title}}  ·  {{category}}"
    sortable_fields: [publishedAt, title, category]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Featured, field: featured, pattern: true }
    fields:
      - label: Title
        name: title
        widget: string
        hint: The headline — shown big in Instrument Serif italic.

      - label: Subtitle / summary (dek)
        name: dek
        widget: text
        required: false
        hint: One or two sentences under the headline. Also used for Google + link-share previews.

      - label: Category
        name: category
        widget: select
        default: Culture
        options: [Global, US, Canada, Climate, Tech, Money, Culture, Policy, Fashion]

      - label: Published date
        name: publishedAt
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
        picker_utc: true

      - label: Updated date
        name: updatedAt
        widget: datetime
        required: false
        date_format: 'YYYY-MM-DD'
        time_format: false
        format: 'YYYY-MM-DD'
        picker_utc: true
        hint: Optional. Set if you meaningfully revise a piece after publishing.

      - label: Hero image
        name: heroImage
        widget: image
        required: false
        hint: The big image at the top. Stored next to the article and optimized automatically.

      - label: Read time (minutes)
        name: readTime
        widget: number
        required: false
        value_type: int
        min: 1
        hint: Leave blank to auto-estimate from the word count.

      - label: Featured (lead story on the home page)
        name: featured
        widget: boolean
        default: false
        hint: Only ONE article should be featured at a time.

      - label: Draft (hide from the live site)
        name: draft
        widget: boolean
        default: false

      - label: Tags
        name: tags
        widget: list
        required: false
        hint: Optional keywords, e.g. sneakers, resale.

      - label: Body
        name: body
        widget: markdown
        hint: Write the article here. Add images, headings, quotes, lists.
