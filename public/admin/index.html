<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>genzthinks · Editor</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0b;
      }
      /* On-brand splash shown only until Sveltia CMS mounts and takes over.
         Prevents the white flash while the CMS script downloads. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0a0a0b;
        color: #f4f4f5;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      #boot .logo {
        width: 56px;
        height: 56px;
      }
      #boot .title {
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      #boot .title b {
        font-style: italic;
        font-weight: 600;
      }
      #boot .sub {
        font-size: 13px;
        color: rgba(244, 244, 245, 0.55);
      }
      #boot .spin {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.8);
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .spin {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="wrap">
        <img class="logo" src="/favicon.svg" alt="" width="56" height="56" />
        <div class="title"><b>genzthinks</b> Editor</div>
        <div class="spin" aria-hidden="true"></div>
        <div class="sub">Loading your studio…</div>
      </div>
    </div>

    <!-- Remove the splash the moment Sveltia inserts its own UI (with a safety net). -->
    <script>
      (function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        function done() {
          boot.style.transition = 'opacity .3s ease';
          boot.style.opacity = '0';
          setTimeout(function () {
            if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
          }, 350);
        }
        var obs = new MutationObserver(function () {
          var kids = document.body.children;
          for (var i = 0; i < kids.length; i++) {
            var el = kids[i];
            if (el.id !== 'boot' && el.tagName !== 'SCRIPT') {
              obs.disconnect();
              done();
              return;
            }
          }
        });
        obs.observe(document.body, { childList: true });
        // Never let the splash get stuck if mounting is slow.
        setTimeout(function () {
          obs.disconnect();
          done();
        }, 8000);
      })();
    </script>

    <!-- Sveltia CMS (Decap-compatible, better on mobile). Reads ./config.yml. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
